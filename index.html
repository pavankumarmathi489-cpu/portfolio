<style>
  :root{
    --bg: #05080E;
    --panel: rgba(16,26,38,0.55);
    --panel-solid: #0B121C;
    --line: rgba(94,234,212,0.16);
    --line-strong: rgba(94,234,212,0.4);
    --cyan: #5EEAD4;
    --cyan-bright: #9CFCEE;
    --violet: #9D8CF7;
    --red: #F17878;
    --text: #E8EFF5;
    --text-dim: #8CA0AE;
    --text-faint: #526270;
    --mono: 'JetBrains Mono', monospace;
    --head: 'Space Grotesk', sans-serif;
    --sans: 'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.65; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--cyan); color:#05080E; }
  a{ color:inherit; }
  h1,h2,h3{ font-family:var(--head); margin:0; font-weight:600; }
  button{ font-family:inherit; }

  #bg-canvas{ position:fixed; inset:0; z-index:-2; }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(94,234,212,0.07), transparent 70%);
  }

  .wrap{ max-width:980px; margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  .tag-label{
    display:inline-flex; align-items:center; gap:9px;
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--cyan);
    margin-bottom:18px;
  }
  .tag-label .blink{ width:6px; height:6px; border-radius:50%; background:var(--cyan); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }
  @media (prefers-reduced-motion: reduce){ .blink{ animation:none; } }

  .panel{ opacity:0; transform:translateX(-26px); transition:opacity .7s ease, transform .7s ease; }
  .panel[data-dir="right"]{ transform:translateX(26px); }
  .panel[data-dir="up"]{ transform:translateY(24px); }
  .panel.in{ opacity:1; transform:translate(0,0); }
  @media (prefers-reduced-motion: reduce){ .panel{ opacity:1; transform:none; transition:none; } }

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(5,8,14,0.7); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 32px; max-width:980px; margin:0 auto; }
  .brand{ font-family:var(--mono); font-size:13.5px; letter-spacing:0.05em; color:var(--text-dim); display:flex; align-items:center; gap:9px; }
  .brand .ring{ width:8px; height:8px; border-radius:50%; border:1.5px solid var(--cyan); }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:10px 20px;
    border-radius:2px; font-size:13px; font-family:var(--mono); letter-spacing:0.03em;
    text-decoration:none; border:1px solid var(--line-strong); transition:all .15s; white-space:nowrap;
    cursor:pointer; background:transparent; color:var(--text);
  }
  .btn-fill{ background:var(--cyan); color:#05080E; border-color:var(--cyan); font-weight:600; }
  .btn-fill:hover, .btn-fill:focus-visible{ background:var(--cyan-bright); border-color:var(--cyan-bright); }
  .btn-ghost{ color:var(--text-dim); }
  .btn-ghost:hover, .btn-ghost:focus-visible{ color:var(--cyan); border-color:var(--cyan); }
  .btn-sm{ padding:6px 12px; font-size:11.5px; }
  .btn-danger{ border-color:rgba(241,120,120,0.4); color:var(--red); }
  .btn-danger:hover{ background:rgba(241,120,120,0.1); }

  .spy{ position:fixed; right:28px; top:50%; transform:translateY(-50%); z-index:40; display:flex; flex-direction:column; gap:16px; }
  .spy a{ width:8px; height:8px; border-radius:50%; border:1.5px solid var(--line-strong); display:block; transition:all .2s; }
  .spy a.active{ background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px var(--cyan); transform:scale(1.3); }
  @media (max-width:900px){ .spy{ display:none; } }

  .hero{ min-height:92vh; display:flex; align-items:center; padding:60px 0; }
  .hero-inner{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:center; width:100%; }
  @media (max-width:880px){ .hero-inner{ grid-template-columns:1fr; } }
  .hero h1{ font-size:clamp(38px,6.2vw,66px); line-height:1.04; }
  .hero h1 .glow{ color:var(--cyan-bright); text-shadow:0 0 24px rgba(94,234,212,0.35); }
  .hero .role{ font-family:var(--mono); font-size:14px; color:var(--text-dim); margin-top:16px; letter-spacing:0.03em; }
  .hero .lede{ margin-top:22px; font-size:16.5px; color:var(--text-dim); max-width:52ch; }
  .hero-cta{ margin-top:34px; display:flex; gap:14px; flex-wrap:wrap; }

  .readout{ margin-top:44px; border:1px solid var(--line); border-radius:2px; background:var(--panel); backdrop-filter:blur(6px); padding:18px 22px; max-width:420px; }
  .readout-line{ display:flex; justify-content:space-between; padding:7px 0; font-family:var(--mono); font-size:12.5px; border-bottom:1px dashed var(--line); gap:10px; }
  .readout-line:last-child{ border-bottom:none; }
  .readout-line .k{ color:var(--text-faint); }
  .readout-line .v{ color:var(--cyan-bright); text-align:right; }

  .core{ position:relative; aspect-ratio:1; max-width:320px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
  .core .ring{ position:absolute; inset:0; border-radius:50%; border:1px solid var(--line-strong); }
  .core .ring.spin{ animation:spin 18s linear infinite; border-style:dashed; }
  .core .ring.spin-rev{ inset:32px; animation:spinrev 26s linear infinite; }

  @keyframes spinrev{ to{ transform:rotate(-360deg); } }
  @media (prefers-reduced-motion: reduce){ .core .ring.spin, .core .ring.spin-rev{ animation:none; } }
  .core .hub{

    background:radial-gradient(circle at 40% 35%, rgba(94,234,212,0.18), rgba(11,18,28,0.9) 70%);

    font-family:var(--head); font-size:34px; font-weight:600; color:var(--cyan-bright);
    box-shadow:0 0 40px rgba(94,234,212,0.18);

  .core .hub img{ width:100%; height:100%; object-fit:cover; }
  .photo-controls{ display:flex; gap:8px; justify-content:center; margin-top:16px; }

  .section-head p{ margin-top:14px; color:var(--text-dim); font-size:15.5px; }

  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start; }
  @media (max-width:840px){ .about-grid{ grid-template-columns:1fr; } }
  .about-grid p{ color:var(--text-dim); font-size:15.5px; margin:0 0 16px; }
  .about-grid strong{ color:var(--text); font-weight:600; }

  .status-window{ border:1px solid var(--line-strong); border-radius:3px; background:var(--panel); backdrop-filter:blur(6px); overflow:hidden; position:relative; }
  .status-window::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--cyan), transparent); }
  .status-head{ padding:16px 22px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:12px; color:var(--cyan); letter-spacing:0.08em; display:flex; justify-content:space-between; }
  .status-body{ padding:20px 22px; }
  .status-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; gap:12px; }
  .status-row:last-child{ border-bottom:none; }
  .status-row .k{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); white-space:nowrap; }
  .status-row .v{ color:var(--text); text-align:right; }

  .loadout{ display:flex; flex-direction:column; gap:14px; }
  .loadout-row{ display:grid; grid-template-columns:170px 1fr; border:1px solid var(--line); border-left:2px solid var(--cyan); border-radius:2px; background:var(--panel); overflow:hidden; }
  .loadout-cat{ padding:16px 20px; font-family:var(--mono); font-size:12px; color:var(--cyan-bright); letter-spacing:0.05em; display:flex; align-items:center; justify-content:space-between; gap:8px; }

  @media (max-width:600px){ .loadout-row{ grid-template-columns:1fr; } .loadout-items{ border-left:none; border-top:1px solid var(--line); } }
  .chip{ font-size:12px; padding:5px 12px; border-radius:16px; border:1px solid var(--line-strong); color:var(--text-dim); font-family:var(--mono); display:inline-flex; align-items:center; gap:6px; }
  .chip .x{ cursor:pointer; color:var(--red); font-weight:700; }
  .add-cat-row{ display:flex; }

  .buildlog{ display:flex; flex-direction:column; gap:16px; }
  details.entry{ border:1px solid var(--line); border-radius:3px; background:var(--panel); backdrop-filter:blur(6px); overflow:hidden; }
  details.entry[open]{ border-color:var(--line-strong); }

  .entry-left{ display:flex; align-items:center; gap:14px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .status-dot.active{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .status-dot.done{ background:var(--violet); box-shadow:0 0 8px var(--violet); }

  .entry-status{ font-family:var(--mono); font-size:11px; letter-spacing:0.06em; color:var(--text-faint); }

  .entry-body{ padding:0 24px 26px; }

  .transmit{ border:1px solid var(--line-strong); border-radius:3px; background:var(--panel); backdrop-filter:blur(6px); padding:48px; display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:center; }

  .del-btn{ border-color:rgba(241,120,120,0.4); color:var(--red); }
  .del-btn:hover{ background:rgba(241,120,120,0.1); }

  #modal-overlay{
    position:fixed; inset:0; z-index:100; background:rgba(5,8,14,0.75); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  #modal-overlay.show{ display:flex; }
  #modal-box{
    width:100%; max-width:520px; max-height:86vh; overflow-y:auto;

  .modal-hint{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); margin:-10px 0 20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-bottom:7px; letter-spacing:0.03em; }
  .field input[type=text], .field input[type=password], .field input[type=email], .field textarea, .field select{

  .field input[type=file]{ color:var(--text-dim); font-size:13px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
</style>

  function openModal(title, fields, onSave, hint){
    modalTitle.textContent = title;
    if(hint){ modalHint.style.display='block'; modalHint.textContent = hint; } else { modalHint.style.display='none'; }
    modalFields.innerHTML = '';
    fields.forEach(function(f){
      var wrap = document.createElement('div'); wrap.className='field';
      var label = document.createElement('label'); label.textContent = f.label; wrap.appendChild(label);
      var input;
      if(f.type === 'textarea'){ input = document.createElement('textarea'); input.value = f.value||''; }
      else if(f.type === 'select'){
        input = document.createElement('select');
        (f.options||[]).forEach(function(o){ var opt=document.createElement('option'); opt.value=o.value; opt.textContent=o.label; if(o.value===f.value) opt.selected=true; input.appendChild(opt); });
      } else if(f.type === 'file'){ input = document.createElement('input'); input.type='file'; input.accept='image/*'; }
      else { input = document.createElement('input'); input.type = f.type || 'text'; input.value = f.value||''; }
      input.id = 'mf_' + f.key;
      wrap.appendChild(input);
      modalFields.appendChild(wrap);
    });
    currentOnSave = function(){
      var out = {};
      var pending = [];
      fields.forEach(function(f){
        var el = document.getElementById('mf_' + f.key);
        if(f.type === 'file'){
          if(el.files && el.files[0]){
            pending.push(new Promise(function(resolve){
              var reader = new FileReader();
              reader.onload = function(){ out[f.key] = reader.result; resolve(); };
              reader.readAsDataURL(el.files[0]);
            }));
          }
        } else { out[f.key] = el.value; }
      });
      Promise.all(pending).then(function(){ onSave(out); closeModal(); });
    };
    overlay.classList.add('show');
  }
  function closeModal(){ overlay.classList.remove('show'); currentOnSave = null; }
  modalCancelBtn.addEventListener('click', closeModal);
  modalSaveBtn.addEventListener('click', function(){ if(currentOnSave) currentOnSave(); });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });

  /* ---------------- live particle background ---------------- */
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var w, h;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = 46;
  var particles = [];
  for (var i = 0; i < N; i++){
    particles.push({ x: Math.random()*w, y: Math.random()*h, vx:(Math.random()-0.5)*0.22, vy:(Math.random()-0.5)*0.22 });
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = 'rgba(94,234,212,0.6)';
    for(var i2=0;i2<particles.length;i2++){
      var p = particles[i2];
      if(!reduced){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; }
      ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2); ctx.fill();
    }
    for(var a=0;a<particles.length;a++){
      for(var b=a+1;b<particles.length;b++){
        var pa=particles[a], pb=particles[b]; var dx=pa.x-pb.x, dy=pa.y-pb.y; var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<130){ ctx.strokeStyle='rgba(94,234,212,'+(0.14*(1-dist/130))+')'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke(); }
      }
    }
    if(!reduced) requestAnimationFrame(draw);
  }
  draw();

  /* ---------------- scroll reveal ---------------- */
  var revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){ if(entry.isIntersecting){ entry.target.classList.add('in'); revealObserver.unobserve(entry.target); } });
  }, { threshold: 0.15 });
  function initReveal(container){ container.querySelectorAll('.panel').forEach(function(el){ revealObserver.observe(el); }); }

  /* ---------------- scrollspy ---------------- */
  var spyLinks = document.querySelectorAll('.spy a');
  var spyObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var link = document.querySelector('.spy a[data-target="'+entry.target.id+'"]');
      if(!link) return;
      if(entry.isIntersecting){ spyLinks.forEach(function(l){l.classList.remove('active');}); link.classList.add('active'); }
    });
  }, { rootMargin: '-45% 0px -45% 0px' });
  ['hero','about','skills','projects','missionlog','contact'].forEach(function(id){
    var el = document.getElementById(id); if(el) spyObserver.observe(el);
  });

  /* ---------------- init ---------------- */
  loadState().then(renderAll);
})();
